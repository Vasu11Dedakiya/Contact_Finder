<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    /* General Page Styling */
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://source.unsplash.com/1600x900/?technology,ai') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: white;
      text-align: center;
    }
    /* Main Container */
    .container {
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 500px;
      transition: all 0.3s ease-in-out;
    }
    h2 {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 24px;
    }
    /* Form Styling */
    .form-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input[type="text"] {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    input[type="text"]:focus {
      outline: none;
      box-shadow: 0px 0px 10px rgba(255, 126, 179, 0.7);
    }
    button {
      background: #ff7eb3;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    button:hover {
      background: #ff5277;
      transform: scale(1.05);
    }
    /* Loader Animation */
    .loader {
      display: none; /* Hidden by default */
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 6px solid #ff7eb3;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-top: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Results Section */
    .results {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .results h3 {
      margin-bottom: 10px;
    }
    pre {
      text-align: left;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: monospace;
    }
    /* Footer */
    .footer {
      position: fixed;
      bottom: 10px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
  <script>
    function showLoader() {
      document.getElementById("loader").style.display = "block";
    }
  </script>
</head>
<body>
  <div class="container">
    <h2>Extract Contact Details</h2>
    <form method="post" class="form-group" onsubmit="showLoader()">
      <input type="text" name="url" placeholder="Enter website URL" required />
      <button type="submit">Extract</button>
      <div id="loader" class="loader"></div> <!-- Loader -->
    </form>
    <div class="results">
      {% if url %}
        <h3>Results for: {{ url }}</h3>
      {% endif %}
      {% if result %}
        <pre>{{ result }}</pre>
      {% elif error %}
        <p>Error: {{ error }}</p>
      {% endif %}
    </div>
  </div>
  <div class="footer">© 2025 Contact Extractor</div>
</body>
</html>
